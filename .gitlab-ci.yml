stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  REGISTRY: $CI_REGISTRY
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  PNPM_VERSION: "9.15.4"

# 캐시 설정
.pnpm-cache: &pnpm-cache
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

# Lint
lint:
  stage: validate
  image: node:20-alpine
  <<: *pnpm-cache
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Test
test:
  stage: validate
  image: node:20-alpine
  <<: *pnpm-cache
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @aws-internal/db test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build Docker Image
build:cloudwatch-viewer:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -f apps/cloudwatch-viewer/Dockerfile \
        -t $REGISTRY/aws-internal/cloudwatch-viewer:$IMAGE_TAG \
        -t $REGISTRY/aws-internal/cloudwatch-viewer:latest \
        .
    - docker push $REGISTRY/aws-internal/cloudwatch-viewer:$IMAGE_TAG
    - docker push $REGISTRY/aws-internal/cloudwatch-viewer:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy Template
.deploy-template: &deploy-template
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

deploy:staging:
  <<: *deploy-template
  environment:
    name: staging
  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST "
        cd /opt/aws-internal && \
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && \
        TAG=$IMAGE_TAG docker compose pull cloudwatch-viewer && \
        TAG=$IMAGE_TAG docker compose up -d cloudwatch-viewer
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  <<: *deploy-template
  environment:
    name: production
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_HOST "
        cd /opt/aws-internal && \
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && \
        TAG=$IMAGE_TAG docker compose pull cloudwatch-viewer && \
        TAG=$IMAGE_TAG docker compose up -d cloudwatch-viewer
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
